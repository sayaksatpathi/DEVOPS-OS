name: Build DevOS image

# Builds a bootable DevOS cloud image (qcow2) and boot-tests it under UEFI in QEMU.
# Manual trigger (and optional tag builds). This produces an EXPERIMENTAL artifact,
# not a signed public release — it is uploaded to the workflow run, not published.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated DevOS profiles to bake in"
        required: true
        default: "core,containers"
      desktop:
        description: "Also build the heavier GNOME desktop image?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      iso:
        description: "Also build the installer ISO (unattended install)?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      repro:
        description: "Run the independent-reproducibility check (builds twice)?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      failtest:
        description: "Run the VM failure-injection + backup/restore suite?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      upgrade:
        description: "Run the OS upgrade (apply + reboot) test?"
        type: choice
        options: ["no", "yes"]
        default: "no"
      fde:
        description: "Build the installer ISO with full-disk encryption (needs iso=yes)?"
        type: choice
        options: ["no", "yes"]
        default: "no"
  push:
    tags:
      - "v*"

permissions:
  contents: write       # create a Release on tag builds
  id-token: write       # keyless Sigstore/cosign signing + provenance (OIDC)
  attestations: write   # actions/attest-build-provenance

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration, falls back to TCG if absent)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm; QEMU will use TCG (slower)"

      - name: Install image build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libguestfs-tools qemu-system-x86 qemu-utils ovmf cloud-image-utils swtpm
          # libguestfs on GitHub runners needs a world-readable kernel for its appliance.
          sudo chmod 0644 /boot/vmlinuz-* || true
          # libguestfs uses 'passt' for appliance networking when the binary is present,
          # but passt is broken on the runner ("passt exited with status 1"). Remove it so
          # libguestfs falls back to the reliable built-in slirp backend.
          sudo apt-get remove -y passt >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/passt /usr/sbin/passt || true
          echo "passt present after removal: $(command -v passt || echo 'no (good)')"

      - name: Build DevOS cloud image
        env:
          LIBGUESTFS_BACKEND: direct
        run: sudo -E bash image/build-cloud-image.sh "${{ github.event.inputs.profiles || 'core,containers' }}"

      - name: Boot test (QEMU / UEFI)
        run: sudo -E bash image/boot-test.sh

      - name: Secure Boot boot test (signed chain under SB)
        run: sudo -E env SECBOOT=1 bash image/boot-test.sh

      - name: vTPM boot test (boots with an emulated TPM 2.0)
        # Best-effort: TPM-backed FDE is deferred (ADR-0006); a flaky swtpm harness on the
        # runner must not block a release whose Secure Boot test already passed.
        continue-on-error: true
        run: sudo -E env TPM=1 bash image/boot-test.sh

      - name: Generate SBOM from image package inventory
        run: |
          sudo chown -R "$USER" image/out 2>/dev/null || true
          python3 - image/out/packages.tsv image/out/devos.sbom.cdx.json "${GITHUB_REF_NAME:-dev}" image/out/extra-components.tsv <<'PY'
          import json, sys
          tsv, out, ver = sys.argv[1], sys.argv[2], sys.argv[3]
          extra = sys.argv[4] if len(sys.argv) > 4 else None
          comps = []
          try:
              for line in open(tsv, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if "\t" not in line: continue
                  name, version = line.split("\t", 1)
                  comps.append({"type": "library", "name": name, "version": version,
                                "purl": f"pkg:deb/ubuntu/{name}@{version}?distro=ubuntu-26.04"})
          except FileNotFoundError:
              pass
          # SBOM completeness: binary tools (OpenTofu, kubectl…) + the devos engine itself.
          try:
              for line in open(extra, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if "\t" not in line: continue
                  name, version = line.split("\t", 1)
                  comps.append({"type": "application", "name": name, "version": version,
                                "purl": f"pkg:generic/{name}@{version}"})
          except (FileNotFoundError, TypeError):
              pass
          json.dump({"bomFormat": "CycloneDX", "specVersion": "1.5",
                     "metadata": {"component": {"type": "operating-system",
                                  "name": "DevOS", "version": ver}},
                     "components": comps}, open(out, "w"), indent=1)
          print(f"SBOM components: {len(comps)}")
          PY

      - name: CVE scan (Trivy on SBOM — reliable, report-only)
        continue-on-error: true
        run: |
          TRIVY_VER=0.76.1
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}"
          curl -fsSL "$base/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          curl -fsSL "$base/trivy_${TRIVY_VER}_checksums.txt" -o /tmp/trivy.sums
          want="$(grep 'Linux-64bit.tar.gz' /tmp/trivy.sums | awk '{print $1}' | head -1)"
          echo "${want}  /tmp/trivy.tgz" | sha256sum -c -
          tar xzf /tmp/trivy.tgz -C /tmp trivy
          echo "CVE scan $(date -u)" > image/out/trivy-vuln.txt
          /tmp/trivy sbom --scanners vuln --severity HIGH,CRITICAL --no-progress \
            --format table image/out/devos.sbom.cdx.json >> image/out/trivy-vuln.txt 2>&1 \
            || echo "(trivy scan exited non-zero)" >> image/out/trivy-vuln.txt
          # License inventory (gap #5) from the SBOM — human sign-off still required.
          echo "License inventory $(date -u)" > image/out/licenses.txt
          /tmp/trivy sbom --scanners license --no-progress \
            --format table image/out/devos.sbom.cdx.json >> image/out/licenses.txt 2>&1 \
            || echo "(license scan exited non-zero)" >> image/out/licenses.txt
          echo "=== report ==="; tail -15 image/out/trivy-vuln.txt

      - name: CVE summary
        if: always()
        run: |
          echo "## CVE scan (HIGH/CRITICAL, from SBOM)" >> "$GITHUB_STEP_SUMMARY"
          [ -f image/out/trivy-vuln.txt ] && tail -20 image/out/trivy-vuln.txt >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$USER" image/out || true

      - name: Upload image + logs (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devos-cloud-image
          path: |
            image/out/devos.qcow2
            image/out/devos.qcow2.sha256
            image/out/serial.log
          retention-days: 7
          if-no-files-found: warn

      - name: Publish prerelease with image (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ver="${GITHUB_REF_NAME}"
          asset="image/out/devos-${ver}-amd64.qcow2"
          # Fresh-compress the finished image so the release asset is small and under
          # GitHub's 2 GiB per-asset limit.
          qemu-img convert -O qcow2 -c image/out/devos.qcow2 "$asset"
          ( cd image/out && sha256sum "devos-${ver}-amd64.qcow2" > "devos-${ver}-amd64.qcow2.sha256" )
          ls -lh "$asset"; echo "asset bytes: $(stat -c%s "$asset")"
          # Create the release if it doesn't exist yet, then upload (idempotent).
          gh release view "$ver" >/dev/null 2>&1 || \
            gh release create "$ver" --prerelease \
              --title "DevOS ${ver} (experimental)" \
              --notes-file image/release-notes.md
          gh release upload "$ver" \
            "$asset" "image/out/devos-${ver}-amd64.qcow2.sha256" --clobber

      - name: Attach build manifest (provenance summary)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME}"
          sum="$(cut -d' ' -f1 image/out/devos-${ver}-amd64.qcow2.sha256)"
          cat > "image/out/devos-${ver}.manifest.json" <<JSON
          {
            "name": "DevOS",
            "version": "${ver}",
            "arch": "amd64",
            "base_image": "ubuntu-26.04-server-cloudimg-amd64",
            "profiles": "${{ github.event.inputs.profiles || 'core,containers' }}",
            "image_sha256": "${sum}",
            "built_by": "github-actions run ${{ github.run_id }}",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}"
          }
          JSON
          gh release upload "$ver" "image/out/devos-${ver}.manifest.json" --clobber

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_YES: "true"
        run: |
          ver="${GITHUB_REF_NAME}"
          asset="image/out/devos-${ver}-amd64.qcow2"
          cosign sign-blob --yes \
            --output-signature "${asset}.sig" \
            --output-certificate "${asset}.pem" \
            "$asset"
          gh release upload "$ver" "${asset}.sig" "${asset}.pem" --clobber

      - name: Attest build provenance (SLSA, Sigstore)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: image/out/devos-${{ github.ref_name }}-amd64.qcow2

      - name: Attach SBOM + CVE report to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME}"
          sbom="image/out/devos-${ver}.sbom.cdx.json"
          cp -f image/out/devos.sbom.cdx.json "$sbom" 2>/dev/null || true
          for f in "$sbom" image/out/packages.tsv image/out/trivy-vuln.txt image/out/licenses.txt; do
            [ -f "$f" ] && gh release upload "$ver" "$f" --clobber || true
          done

  build-desktop-image:
    # Heavier GNOME desktop image. Manual only (workflow_dispatch with desktop=yes),
    # so it doesn't run on every tag. Uploaded as a workflow artifact (too large for
    # a 2 GiB release asset); verified by booting under UEFI like the cloud image.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.desktop == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Install image build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libguestfs-tools qemu-system-x86 qemu-utils ovmf cloud-image-utils
          sudo chmod 0644 /boot/vmlinuz-* || true
          sudo apt-get remove -y passt >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/passt /usr/sbin/passt || true
      - name: Build DevOS desktop image (core + containers + GNOME desktop)
        env:
          LIBGUESTFS_BACKEND: direct
        run: sudo -E bash image/build-cloud-image.sh "core,containers,desktop"
      - name: Boot test — assert GNOME session (gdm3 enabled + gnome-shell present)
        run: sudo -E env MARKER=DEVOS_DESKTOP_OK_GNOME_SESSION bash image/boot-test.sh
      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$USER" image/out || true
      - name: Upload desktop image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devos-desktop-image
          path: |
            image/out/devos.qcow2
            image/out/devos.qcow2.sha256
            image/out/serial.log
          retention-days: 7
          if-no-files-found: warn

  build-installer-iso:
    # Real installer ISO (unattended autoinstall). Manual only (workflow_dispatch iso=yes).
    # CI installs the fast 'core' profile end-to-end so the boot-test can verify a full
    # unattended install under UEFI; the ISO itself can bake any profiles.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.iso == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Install image build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 qemu-utils ovmf whois
      - name: Build DevOS installer ISO (core)
        env:
          FDE: ${{ github.event.inputs.fde == 'yes' && '1' || '0' }}
        run: sudo -E bash image/build-installer-iso.sh "core"
      - name: Installer boot test (QEMU / UEFI, unattended install)
        run: sudo -E bash image/boot-installer-test.sh
      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$USER" image/out || true
      - name: Upload installer ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devos-installer-iso
          path: |
            image/out/devos-installer-amd64.iso
            image/out/devos-installer-amd64.iso.sha256
            image/out/installer-serial.log
          retention-days: 7
          if-no-files-found: warn

  reproducibility:
    # Independent-reproducibility check (Alpha-1 #8 / gap #14): build the image twice and
    # assert the installed package set (name+version) matches. Manual (dispatch repro=yes).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.repro == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-system-x86 qemu-utils ovmf cloud-image-utils
          sudo chmod 0644 /boot/vmlinuz-* || true
          sudo apt-get remove -y passt >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/passt /usr/sbin/passt || true
      - name: Build #1
        env: { LIBGUESTFS_BACKEND: direct }
        run: |
          sudo -E bash image/build-cloud-image.sh "core,containers"
          sort image/out/packages.tsv > /tmp/pkgs-1.tsv
          sudo rm -f image/out/devos.qcow2 image/out/ubuntu-26.04-server-cloudimg-amd64.img
      - name: Build #2
        env: { LIBGUESTFS_BACKEND: direct }
        run: |
          sudo -E bash image/build-cloud-image.sh "core,containers"
          sort image/out/packages.tsv > /tmp/pkgs-2.tsv
      - name: Compare package sets
        run: |
          if diff -u /tmp/pkgs-1.tsv /tmp/pkgs-2.tsv > /tmp/pkgs.diff; then
            echo "REPRODUCIBLE: identical installed package sets across two independent builds."
          else
            echo "DIFFERENCES between builds (package name=version):"
            cat /tmp/pkgs.diff
            echo "note: minor diffs can come from mirror updates between builds; review above."
            exit 1
          fi

  failure-injection:
    # VM-level failure injection (§13.3 / gap #13) on a disposable runner. Manual (failtest=yes).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.failtest == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install provisioning tooling
        run: sudo apt-get update && sudo apt-get install -y ansible-core python3
      - name: Run failure-injection suite
        run: sudo -E bash tests/vm/failure-injection.sh
      - name: Run backup/restore recovery test
        run: sudo -E bash tests/vm/backup-restore.sh

  os-upgrade:
    # OS upgrade applied + rebooted (gap #4). Manual (dispatch upgrade=yes).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.upgrade == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-system-x86 qemu-utils ovmf cloud-image-utils
          sudo chmod 0644 /boot/vmlinuz-* || true
          sudo apt-get remove -y passt >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/passt /usr/sbin/passt || true
      - name: Build base image
        env: { LIBGUESTFS_BACKEND: direct }
        run: sudo -E bash image/build-cloud-image.sh "core"
      - name: OS upgrade + reboot test
        run: sudo -E bash image/upgrade-test.sh
      - name: Upload upgrade serial log
        if: always()
        run: sudo chown -R "$USER" image/out 2>/dev/null || true
      - name: Save serial artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-serial-log
          path: image/out/upgrade-serial.log
          if-no-files-found: warn
