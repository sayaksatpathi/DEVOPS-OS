---
# Install one verified binary tool with REAL upstream-signature verification:
#  1. cosign-verify the upstream SHA256SUMS against the project's release identity (keyless),
#  2. extract the artifact's checksum from the VERIFIED sums,
#  3. download the artifact and verify it against that checksum.
# This is signature-chain verification, not trust-on-first-use.

- name: "Ensure cosign is available for {{ spec.name }}"
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
    dest: /usr/local/bin/cosign
    mode: "0755"
    checksum: "sha256:424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
  when: (spec.sumsUrl | default('') | length > 0) or (spec.blobSigUrl | default('') | length > 0)

- name: "Download SHA256SUMS + signature + cert for {{ spec.name }}"
  become: true
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/devos-{{ spec.name }}-{{ item.name }}"
    mode: "0644"
  loop:
    - { name: sums, url: "{{ spec.sumsUrl }}" }
    - { name: sig,  url: "{{ spec.sigUrl }}" }
    - { name: cert, url: "{{ spec.certUrl }}" }
  loop_control: { label: "{{ item.name }}" }
  when: spec.sumsUrl | default('') | length > 0

- name: "cosign verify-blob the SHA256SUMS of {{ spec.name }} (authenticity)"
  become: true
  ansible.builtin.command:
    argv:
      - cosign
      - verify-blob
      - "--certificate=/tmp/devos-{{ spec.name }}-cert"
      - "--signature=/tmp/devos-{{ spec.name }}-sig"
      - "--certificate-identity-regexp={{ spec.certIdentityRegexp }}"
      - "--certificate-oidc-issuer={{ spec.certOidcIssuer }}"
      - "/tmp/devos-{{ spec.name }}-sums"
  register: devos_cosign
  changed_when: false
  when: spec.sumsUrl | default('') | length > 0

- name: "Extract the VERIFIED checksum for {{ spec.sumEntry | default(spec.name) }}"
  become: true
  ansible.builtin.shell: >-
    awk '$2=="{{ spec.sumEntry }}"{print $1}' /tmp/devos-{{ spec.name }}-sums | head -1
  register: devos_verified_sum
  changed_when: false
  when: spec.sumsUrl | default('') | length > 0

- name: "Pin the checksum to the verified value for {{ spec.name }}"
  ansible.builtin.set_fact:
    devos_checksum: >-
      {{ ('sha256:' + devos_verified_sum.stdout | trim)
         if (spec.sumsUrl | default('') | length > 0)
         else spec.checksum }}

- name: "Fail if the verified checksum does not match the pinned one ({{ spec.name }})"
  ansible.builtin.assert:
    that:
      - (spec.sumsUrl | default('') | length == 0) or (devos_checksum == spec.checksum)
    fail_msg: >-
      SIGNATURE/CHECKSUM MISMATCH for {{ spec.name }}: verified={{ devos_checksum }}
      pinned={{ spec.checksum }} — refusing to install.

- name: "Download {{ spec.name }} (verified checksum)"
  become: true
  ansible.builtin.get_url:
    url: "{{ spec.url }}"
    dest: "/tmp/devos-dl-{{ spec.name }}"
    checksum: "{{ devos_checksum }}"
    mode: "0644"
    force: true

# cosign "blob" mode: verify the downloaded artifact directly against its .sig/.cert.
- name: "Blob mode: download {{ spec.name }} signature + cert"
  become: true
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/devos-{{ spec.name }}-blob{{ item.name }}"
    mode: "0644"
  loop:
    - { name: sig,  url: "{{ spec.blobSigUrl }}" }
    - { name: cert, url: "{{ spec.blobCertUrl }}" }
  loop_control: { label: "{{ item.name }}" }
  when: spec.blobSigUrl | default('') | length > 0

- name: "Blob mode: cosign verify-blob the {{ spec.name }} artifact (authenticity)"
  become: true
  ansible.builtin.command:
    argv:
      - cosign
      - verify-blob
      - "--certificate=/tmp/devos-{{ spec.name }}-blobcert"
      - "--signature=/tmp/devos-{{ spec.name }}-blobsig"
      - "--certificate-identity-regexp={{ spec.certIdentityRegexp | default('') }}"
      - "--certificate-oidc-issuer={{ spec.certOidcIssuer }}"
      - "/tmp/devos-dl-{{ spec.name }}"
  register: devos_cosign_blob
  changed_when: false
  when: spec.blobSigUrl | default('') | length > 0

- name: "Raw binary: install {{ spec.name }} to /usr/local/bin"
  become: true
  ansible.builtin.copy:
    src: "/tmp/devos-dl-{{ spec.name }}"
    dest: "/usr/local/bin/{{ spec.binOut }}"
    mode: "0755"
    remote_src: true
  when: spec.kind == "raw"

- name: "Archive: make extraction dir for {{ spec.name }}"
  become: true
  ansible.builtin.file:
    path: "/tmp/devos-x-{{ spec.name }}"
    state: directory
    mode: "0755"
  when: spec.kind in ["zip", "targz"]

- name: "Archive: extract {{ spec.name }}"
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/devos-dl-{{ spec.name }}"
    dest: "/tmp/devos-x-{{ spec.name }}"
    remote_src: true
  when: spec.kind in ["zip", "targz"]

- name: "Archive: install {{ spec.binOut }} to /usr/local/bin"
  become: true
  ansible.builtin.copy:
    src: "/tmp/devos-x-{{ spec.name }}/{{ spec.binIn }}"
    dest: "/usr/local/bin/{{ spec.binOut }}"
    mode: "0755"
    remote_src: true
  when: spec.kind in ["zip", "targz"]
