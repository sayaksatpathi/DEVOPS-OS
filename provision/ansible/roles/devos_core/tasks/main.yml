---
- name: Assert a package list was provided by devos
  ansible.builtin.assert:
    that:
      - devos_core_apt_packages is iterable
      - devos_core_apt_packages | length > 0
    fail_msg: >-
      devos_core_apt_packages is empty. The devos CLI should pass the core
      profile's apt tools via --extra-vars. Do not run this role directly.

- name: Install core apt packages (idempotent)
  become: true
  ansible.builtin.apt:
    name: "{{ devos_core_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: devos_core_apt

- name: Report what changed
  ansible.builtin.debug:
    msg: "core apt packages ensured present: {{ devos_core_apt_packages | join(', ') }}"
